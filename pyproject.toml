[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-harness-lab"
version = "0.2.0"
description = "Game adapters and shared Decision-only GEPA Harness evolution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx[socks]>=0.27,<1",
  "python-dotenv>=1,<2",
  "gepa @ https://github.com/gepa-ai/gepa/archive/f1cfdee2856e9dc4b5b4dc5cc2e391d0aa20d819.zip"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_harness = ["static/*.html", "games/*.cjs", "games/vendor/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
