[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-harness-lab"
version = "0.5.0"
description = "Game adapters and shared Decision-only GEPA Harness evolution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx[socks]>=0.27,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "gepa @ https://github.com/gepa-ai/gepa/archive/f1cfdee2856e9dc4b5b4dc5cc2e391d0aa20d819.zip"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
vision = ["Pillow==12.0.0"]
pokemon = ["poke-env @ git+https://github.com/hsahovic/poke-env.git@7ff6212e4e738efd46f1ea52035b37a8bba1e386"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_harness = ["static/*.html", "static/*.js", "games/*.cjs", "games/*.ts", "games/vendor/*",
  "games/vendor/arena-board/*", "games/vendor/arena-board/packages/games/src/*.ts",
  "games/vendor/arena-board/packages/core/src/*.ts",
  "games/vendor/arena-arcade/*", "games/vendor/arena-arcade/packages/games/src/arcade/*.ts",
  "games/vendor/arena-arcade/packages/core/src/*.ts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
