<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showdown 原版动画观战 · Decision Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#223a30;font:14px/1.6 system-ui,-apple-system,sans-serif}header,main{max-width:1180px;margin:auto;padding:20px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;margin:0}h1 small{font-size:12px;color:#66796f;display:block;font-weight:400}a{color:#32674c}main{padding-top:0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}select,button{font:inherit;border:1px solid #cdd8ce;border-radius:7px;padding:8px 12px;background:white;color:inherit}select{max-width:100%;min-width:250px;flex:1}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.stage{background:white;border-radius:12px;box-shadow:0 8px 30px #1b402610;overflow:hidden;border:1px solid #dfe6dc}iframe{display:block;border:0;width:100%;height:680px;background:#fff}.status{padding:12px 18px;border-bottom:1px solid #e7ece3;display:flex;gap:16px;flex-wrap:wrap}.status strong{font-size:15px}.status span{color:#637469}.notice{padding:12px 16px;background:#fff3db;border:1px solid #ead6b4;border-radius:8px;margin:12px 0}.notice[hidden]{display:none}.note{color:#65766b;font-size:13px;margin-top:14px}.pill{background:#e4eedf;border-radius:20px;padding:3px 10px;white-space:nowrap}.meta{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}@media(max-width:650px){header,main{padding:14px}h1{font-size:20px}iframe{height:820px}header{align-items:flex-start}.status{display:block}.toolbar select{min-width:100%}}
</style><script src="/showdown/spectate.js" defer></script></head>
<body><header><h1>Showdown 原版动画观战<small>第三世代单打 3v3 · 双方 Decision 决策 · 思考关闭</small></h1><a href="/">返回实验台</a></header>
<main><div class="toolbar"><select id="episodeSelect" aria-label="选择观战对局"><option value="">等待公开对局</option></select><button id="latest">追到最新</button><button id="next" disabled>下一局</button><label><input id="follow" type="checkbox" checked> 自动接播新对局</label></div>
<div id="notice" class="notice" role="status">正在连接本地观战事件流…</div>
<section class="stage"><div class="status"><strong id="phase">等待对局</strong><span id="progress">招式将按顺序完整播放</span><span id="identity" class="meta"></span></div><iframe id="viewer" title="Showdown 原版精灵动画与战斗日志" sandbox="allow-scripts" referrerpolicy="no-referrer" src="/showdown/frame"></iframe></section>
<p class="note">这里只接收双方已公开的出招、换人和血量事件。动画暂停、倍速与追到最新只改变观看进度，不控制任何游戏动作。模型较快时，动画可能落后实盘；默认播完当前局再接下一局。</p>
<p class="note">在实验台点击“开始实验”即可实时观看。旧记录若未保存完整公开协议会提示不可用。精灵和招式图片按需来自 Pokémon Showdown 官方资源站，需要联网加载。<a href="https://github.com/smogon/pokemon-showdown-client/tree/74056bbbb55d6ce15f9dd254186b94a51fe94b14" target="_blank" rel="noopener noreferrer">原版客户端源码与许可</a> · <a href="/showdown/manifest.json" target="_blank" rel="noopener noreferrer">资源版本与逐项许可</a></p>
</main></body></html>
