<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Showdown 原版动画观战</title>
  <link rel="stylesheet" href="/showdown/assets/style/battle.css">
  <link rel="stylesheet" href="/showdown/assets/style/utilichart.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172538;font:14px system-ui,-apple-system,sans-serif}
    .viewer-tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #dce3ed}
    button,select{font:inherit;border:1px solid #c8d3e2;border-radius:7px;background:#fff;padding:6px 10px;color:inherit;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}#playback-status{font-size:12px;color:#526478;margin-left:auto}
    #battle-stage{position:relative;width:100%;height:362px;overflow:hidden;background:#d4dfeb}
    #battle{position:absolute;top:0;left:0;transform-origin:top left;width:640px;height:360px;box-sizing:content-box}
    #battle-log{position:relative;top:auto;left:auto;right:auto;bottom:auto;width:100%;height:220px;border:0;border-top:1px solid #dce3ed;margin:0;overflow:auto;background:#fff;font-size:12px}
    #battle-log .inner{padding:8px 14px}.viewer-note{padding:8px 12px;font-size:11px;color:#617287;line-height:1.6}
    #viewer-error{display:none;padding:10px 12px;background:#fff3e5;color:#8a3a00;white-space:pre-wrap}
    .viewer-note a{color:#315a90}.battle-log .chat strong{font-weight:600}
  </style>
</head>
<body>
  <div class="viewer-tools" aria-label="动画播放控制">
    <button id="toggle-playback" type="button" disabled>暂停动画</button>
    <button id="replay-animation" type="button" disabled>从头播放</button>
    <label>速度 <select id="animation-speed" aria-label="动画速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <span id="playback-status" role="status">正在加载原版动画引擎…</span>
  </div>
  <div id="viewer-error" role="alert"></div>
  <div id="battle-stage"><div id="battle" class="battle" aria-label="宝可梦对战动画"></div></div>
  <div id="battle-log" class="battle-log" aria-label="双方已公开的招式与换人记录"></div>
  <div class="viewer-note">第三世代规则 · Showdown 动态精灵展示 · 默认静音。播放按钮只影响观战动画，双方操作仍由 Decision 决策。<br>
    精灵及部分特效图片按需从 Showdown 官方站点加载。源码、版本与资源许可见观战页底部链接。
  </div>
  <script>window.exports=window;window.Config={routes:{client:'play.pokemonshowdown.com',dex:'dex.pokemonshowdown.com',root:'pokemonshowdown.com',replays:'replay.pokemonshowdown.com',users:'pokemonshowdown.com/users'}};</script>
  <script src="/showdown/assets/js/lib/jquery-1.11.0.min.js"></script>
  <script src="/showdown/assets/js/lib/html-sanitizer-minified.js"></script>
  <script src="/showdown/assets/js/battle-sound.js"></script>
  <script src="/showdown/assets/js/battledata.js"></script>
  <script>Dex.resourcePrefix='https://play.pokemonshowdown.com/';Dex.fxPrefix='https://play.pokemonshowdown.com/fx/';Dex.prefs=function(name){return name==='nopastgens';};BattleSound.muted=true;</script>
  <script src="/showdown/assets/data/pokedex-mini.js"></script>
  <script src="/showdown/assets/data/pokedex-mini-bw.js"></script>
  <script src="/showdown/assets/data/pokedex.js"></script>
  <script src="/showdown/assets/data/moves.js"></script>
  <script src="/showdown/assets/data/abilities.js"></script>
  <script src="/showdown/assets/data/items.js"></script>
  <script src="/showdown/assets/data/typechart.js"></script>
  <script src="/showdown/assets/data/aliases.js"></script>
  <script src="/showdown/assets/data/teambuilder-tables.js"></script>
  <script src="/showdown/assets/js/battle-scene-stub.js"></script>
  <script src="/showdown/assets/js/battle-tooltips.js"></script>
  <script src="/showdown/assets/data/graphics.js"></script>
  <script src="/showdown/assets/js/battle.js"></script>
  <script src="/showdown/showdown-frame.js"></script>
</body>
</html>
