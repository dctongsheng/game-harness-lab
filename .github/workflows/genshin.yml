name: Genshin agent foundation

on:
  push:
    branches: [feat/genshin-realtime-foundation]
  pull_request:
    paths:
      - src/game_harness/genshin/**
      - tests/test_genshin.py
      - integrations/bettergi/**
      - scripts/setup_genshin_bridge.py
      - .github/workflows/genshin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genshin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-genshin.lock
          python -m pip install --no-deps -e .
      - name: Apply pinned BetterGI integration
        run: python scripts/setup_genshin_bridge.py --checkout "$env:RUNNER_TEMP/bettergi"
      - name: Verify native host protocol
        run: dotnet test "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Tests/BetterGenshinImpact.AgentBridge.Tests.csproj" --nologo -v minimal
      - name: Build fixture host
        run: dotnet build "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Fixture/BetterGenshinImpact.AgentBridge.Fixture.csproj" --nologo -v minimal
      - name: Verify Python and actual Windows named pipes
        run: |
          $env:GENSHIN_DOTNET = (Get-Command dotnet).Source
          $env:GENSHIN_BRIDGE_FIXTURE_DLL = "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Fixture/bin/Debug/net8.0/BetterGenshinImpact.AgentBridge.Fixture.dll"
          python -m pytest tests/test_genshin.py -q
      - name: Compile BetterGI application
        run: dotnet build "$env:RUNNER_TEMP/bettergi/BetterGenshinImpact/BetterGenshinImpact.csproj" --nologo -v quiet
